[project]
name = "ob2-paid-content"
version = "0.1.0"
description = "Платформа публикации платного контента: Django, JWT, Stripe, Bootstrap"
authors = [{ name = "niko" }]
requires-python = ">=3.12,<4"
dependencies = [
    "django (>=6.0,<7)",
    "djangorestframework (>=3.15,<4)",
    "djangorestframework-simplejwt (>=5.3,<6)",
    "python-dotenv (>=1.0,<2)",
    "psycopg[binary] (>=3.2,<4)",
    "stripe (>=15.1.0,<16.0.0)",
    "whitenoise (>=6.6,<7)",
    "gunicorn (>=23.0,<24)",
    "pillow (>=10,<12)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "drf-yasg (>=1.21.15,<2.0.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.0,<0.16.0)",
    "mypy (>=1.19.0,<2.0.0)",
    "pytest (>=9.0.0,<10.0.0)",
    "pytest-django (>=4.12.0,<5.0.0)",
    "django-stubs (>=5.2.0,<6.0.0)",
    "djangorestframework-stubs (>=3.15.0,<4.0.0)",
    "pytest-cov (>=6.0,<7)",
]

[tool.ruff]
line-length = 119
target-version = "py312"
exclude = [
    ".venv",
    "*/migrations/*",
    "_*/**",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "^\\.venv/",
    "(^|/)_[^/]+/",
]

[[tool.mypy.overrides]]
module = "*.management.commands.*"
disallow_untyped_defs = false

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
python_files = ["tests.py", "test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers --cov=config --cov=users --cov=posts --cov-report=term-missing:skip-covered --cov-fail-under=85"

[tool.coverage.run]
branch = true
source = ["users", "posts", "config"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "manage.py",
    "**/asgi.py",
    "**/wsgi.py",
    "*/management/commands/*",
]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
]
