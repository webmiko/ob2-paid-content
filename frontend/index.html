    <meta property="og:type" content="website" />
    <meta property="og:title" content="Creavity" />
    <meta
      property="og:description"
      content="Creavity — публикации авторов: бесплатные материалы для всех, платный контент по одной подписке на платформу."
    />
    <meta property="og:url" content="/" />
    <meta property="og:image" content="/og-default.svg" />
    <meta property="og:image:alt" content="Creavity — платформа авторов" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Creavity" />
    <meta
      name="twitter:description"
      content="Creavity — публикации авторов: бесплатные материалы для всех, платный контент по одной подписке на платформу."
    />
    <meta name="twitter:image" content="/og-default.svg" />
    <link rel="alternate" hreflang="ru" href="/" />
    <title>Creavity</title>
    <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Creavity" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="canonical" href="/" />
    <style>
      html {
        background: #eef1f8;
        color: #0f172a;
      }

      html[data-theme="dark"] {
        background: #0b1120;
        color: #e2e8f0;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif;
        background: inherit;
        color: inherit;
      }
    </style>
    <script>
      (function () {
        "use strict";
        var THEME_KEY = "creavity-theme";
        var DARK_MEDIA = "(prefers-color-scheme: dark)";

        function readPref() {
          var v = localStorage.getItem(THEME_KEY);
          return v === "light" || v === "dark" || v === "auto" ? v : "auto";
        }

        function systemTheme() {
          if (typeof window.matchMedia !== "function") {
            return "light";
          }
          return window.matchMedia(DARK_MEDIA).matches ? "dark" : "light";
        }

        function resolve(pref) {
          if (pref === "light") {
            return "light";
          }
          if (pref === "dark") {
            return "dark";
          }
          return systemTheme();
        }

        var theme = resolve(readPref());
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.bsTheme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        "use strict";
        var path = location.pathname;
        if (path !== "/" && path !== "") {
          return;
        }

        function startFeedPrefetch() {
          window.__CREAVITY_FEED_PREFETCH__ = fetch("/api/posts/", {
            credentials: "same-origin",
            headers: { Accept: "application/json" },
          }).then(function (response) {
            if (!response.ok) {
              throw new Error(String(response.status));
            }
            return response.json();
          });
        }

        if (typeof requestIdleCallback === "function") {
          requestIdleCallback(startFeedPrefetch, { timeout: 2500 });
        } else {
          window.addEventListener("load", startFeedPrefetch, { once: true });
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
